<form name="EmployerRequestModal" class="c-form" autocomplete="on" method="post" novalidate>
  <div class="c-form-group">
    <label for="emp-modal-contact_person">Your Name / Contact Person*</label>
    <input id="emp-modal-contact_person" type="text" name="contact_person" placeholder="Enter your full name" autocomplete="name" required />
  </div>

  <div class="c-form-group">
    <label for="emp-modal-company_role">Company Name &amp; Role*</label>
    <input id="emp-modal-company_role" type="text" name="company_role" placeholder="e.g. ABC Logistics, HR Manager" autocomplete="organization" required />
  </div>

  <div class="c-form-group">
    <label for="emp-modal-company_country">Country where company is located*</label>
    <input id="emp-modal-company_country" type="text" name="company_country" placeholder="e.g. Poland" autocomplete="country-name" required />
  </div>

  <div class="c-form-group">
    <label for="emp-modal-industry">Business sector / Industry</label>
    <input id="emp-modal-industry" type="text" name="industry" placeholder="e.g. Manufacturing, logistics, construction" autocomplete="off" />
  </div>

  <div class="c-form-group">
    <label for="emp-modal-contact">Contact (Phone with Telegram/WhatsApp or Email)*</label>
    <input id="emp-modal-contact" type="text" pattern="^(?:[^\s@]+@[^\s@]+\.[^\s@]+|\+?[0-9][0-9\s\(\)\-]{6,})$" title="Enter a phone number (Telegram/WhatsApp) or an email address" name="contact" placeholder="+48 123 456 789 or name@company.com" autocomplete="on" required />
  </div>

  <div class="c-form-group">
    <label for="emp-modal-request">Number of workers and brief request details</label>
    <div class="c-textarea">
      <textarea id="emp-modal-request" name="request" placeholder="e.g. 10 warehouse workers from April, 12-month contract" maxlength="500" autocomplete="off"></textarea>
      <output class="c-textarea__counter" for="emp-modal-request" aria-live="polite">0/500</output>
    </div>
  </div>

  <input type="hidden" name="location" value="employers" />
  <input type="hidden" name="url" value="" />
  <input type="hidden" name="nospam" value="" />

  <button class="button button-primary button-form js-inquire-button" type="submit">
    Discuss Vacancies with Manager
  </button>
  <p class="c-form__privacy">We process your data to reply to your request. See our <a href="../../privacy-policy.html">Privacy Policy</a>.</p>
</form>

<div class="c-form-message d-none" data-form="EmployerRequestModal" data-form-success>
  <div class="c-form-message__icon">
    <img loading="lazy" decoding="async" src="../../assets/static/icons/form/success.svg" alt="Success icon" />
  </div>
  <div class="c-form-message__content">
    <h2 class="c-form-message__title">Your message has been successfully sent</h2>
    <p class="c-form-message__description">We will contact you soon</p>
  </div>
</div>
